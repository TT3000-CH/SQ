 for(const url of ['https://unpkg.com/swiss-maps@4/2021/ch-combined.json','https://cdn.jsdelivr.net/npm/swiss-maps@4/2021/ch-combined.json']){
  try{AS.geo=makeGeo(await (await timedFetch(url,14000)).json());AS.geoState='ready';await dbPut('geo-2021',AS.geo);assetsChanged();loadNeighbours(AS.geo).catch(()=>{});return;}catch(e){AS.lastError=e.message;}
 }
 AS.geoState='error';assetsChanged();
}

const NBC={DE:['germany','Deutschland',8.9,48.45],FR:['france','Frankreich',5.4,47.2],IT:['italy','Italien',9.3,45.5],AT:['austria','\u00d6sterreich',11.2,47.2],LI:['liechtenstein','FL',9.55,47.17]};
function projectNeighbour(lo,la,p){
 let x=lo,y=la;
 if(!p.geo){
  const phi=(la*3600-169028.66)/1e4,lam=(lo*3600-26782.5)/1e4;
  const east=600072.37+211455.93*lam-10938.51*lam*phi-.36*lam*phi*phi-44.54*lam*lam*lam;
  const north=200147.07+308807.95*phi+3745.25*lam*lam+76.63*phi*phi-194.56*lam*lam*phi+119.79*phi*phi*phi;
  const kx=(p.mxx-p.mnx)/(833850-485410),ky=(p.mxy-p.mny)/(295935-75270);
  x=p.mnx+(east-485410)*kx;y=p.north?p.mny+(north-75270)*ky:p.mxy-(north-75270)*ky;
 }
 return [(x*p.kx-p.x0)*p.scale+p.ox,((p.north?-y:y)-p.y0)*p.scale+p.oy];
}
async function loadNeighbours(g){
 if(!g.projection||g.neighbours)return;
 const items=await Promise.all(Object.entries(NBC).map(async([code,[slug,label,lo,la]])=>{
  try{
   const json=await(await timedFetch('https://cdn.jsdelivr.net/npm/world-geojson@3.4.0/countries/'+slug+'.json',6000)).json(),polys=[];
   function walk(x){if(!x)return;if(x.features)x.features.forEach(walk);else if(x.geometry)walk(x.geometry);else if(x.type==='Polygon')polys.push(x.coordinates);else if(x.type==='MultiPolygon')polys.push(...x.coordinates);}
   walk(json);
   const path=polys.map(p=>p.map(r=>'M'+r.map(q=>projectNeighbour(q[0],q[1],g.projection).map(n=>n.toFixed(2)).join(',')).join('L')+'Z').join('')).join('');
   const xy=projectNeighbour(lo,la,g.projection);return {path,label,xy};
  }catch(e){return null;}
 }));
 const ok=items.filter(Boolean);if(!ok.length)return;
 g.neighbours=ok.map(i=>i.path).join('');g.neighbourLabels=ok.map(i=>({text:i.label,x:i.xy[0],y:i.xy[1]}));await dbPut('geo-2021',g);if(AS.geo===g)assetsChanged();
}
function surroundingMarkup(){return (AS.geo?.neighbours?'<path class="sq-neighbour" fill-rule="evenodd" d="'+AS.geo.neighbours+'"/>':'')+(AS.geo?.neighbourLabels||[]).map(l=>'<text class="sq-label" x="'+(+l.x).toFixed(2)+'" y="'+(+l.y).toFixed(2)+'">'+esc(l.text)+'</text>').join('');}

function validGeo(g){return g&&typeof g==='object'&&C.every(d=>typeof g.paths?.[d.i]==='string'&&Array.isArray(g.bounds?.[d.i])&&g.bounds[d.i].length===4)&&!Object.values(g.paths).some(p=>/[^0-9eE., +\-MLZmlz]/.test(p));}
async function loadAssets(force=false){
 if(AS.loading)return;AS.loading=true;AS.attempt++;
 try{
  if(!force){
   if(validGeo(embedded.geo)){AS.geo=embedded.geo;AS.geoState='ready';}
   const cached=await dbGet('geo-2021');if(!AS.geo&&validGeo(cached)){AS.geo=cached;AS.geoState='ready';}
   await Promise.all(C.map(async d=>{const data=embedded.flags?.[d.i]||await dbGet('flag-'+d.i);if(typeof data==='string'&&data.startsWith('data:image/')&&await imageValid(data,2500)){AS.flags[d.i]=data;AS.dataFlags[d.i]=data;}else{const remote=await dbGet('flag-remote-'+d.i);if(typeof remote==='string'&&remote.startsWith('https://upload.wikimedia.org/')&&await imageValid(remote,2000))AS.flags[d.i]=remote;}}));
  }
  assetsChanged();
  const missing=C.filter(d=>force?!AS.dataFlags[d.i]:!AS.flags[d.i]);
  if(navigator.onLine===false){AS.flagState=Object.keys(AS.flags).length===26?'ready':'offline';AS.geoState=AS.geo?'ready':'offline';return;}
  AS.flagState=missing.length?'loading':'ready';if(!AS.geo)AS.geoState='loading';assetsChanged();
  let cursor=0;const worker=async()=>{while(cursor<missing.length){const d=missing[cursor++];await fetchFlag(d.i);}};
  await Promise.allSettled([fetchGeo(),...Array.from({length:5},worker)]);
  AS.flagState=Object.keys(AS.flags).length===26?'ready':'error';AS.geoState=AS.geo?'ready':'error';
 }catch(e){AS.lastError=e.message;AS.flagState='error';if(!AS.geo)AS.geoState='error';}
 finally{AS.loading=false;assetsChanged();}
}
function flagMarkup(d,cls='flag-frame',answer=false){const src=AS.flags[d.i];return '<span class="'+cls+'" data-flag="'+d.i+'" data-answer="'+(answer?'1':'0')+'">'+(src?'<img class="flag-img" src="'+esc(src)+'" alt="'+(answer?'Kantonsflagge':esc('Flagge '+d.n))+'" draggable="false">':'<span class="flag-unavailable">'+icon('flag')+'<span>Flagge noch nicht geladen</span></span>')+'</span>';}
function outlineMarkup(d){
 if(!AS.geo)return '<div class="flag-unavailable">Umriss noch nicht geladen</div>';
 const [x0,y0,x1,y1]=AS.geo.bounds[d.i],s=Math.max(x1-x0,y1-y0)*.13;
 return '<svg class="outline-figure" viewBox="'+[x0-s,y0-s,x1-x0+2*s,y1-y0+2*s].join(' ')+'" role="img" aria-label="Kantonsumriss"><path fill-rule="evenodd" d="'+AS.geo.paths[d.i]+'"/></svg>';
}

 const info=assetLabel();document.querySelectorAll('[data-asset-status]').forEach(el=>{el.innerHTML='<i class="status-dot '+info.state+'"></i><span>'+esc(info.text)+'</span>';});
 document.querySelectorAll('[data-flag]').forEach(el=>{const d=BY[el.dataset.flag],src=d&&AS.flags[d.i];if(src&&!el.querySelector('img'))el.innerHTML='<img class="flag-img" src="'+esc(src)+'" alt="'+(el.dataset.answer==='1'?'Kantonsflagge':esc('Flagge '+d.n))+'" draggable="false">';});
 if(view==='waiting'&&pending){const n=Object.keys(AS.flags).length;const count=$('assetCount');if(count)count.textContent=pending.type==='geo'?(AS.geo?'Karte bereit':'Karte wird vorbereitet'):n+' / 26 Flaggen bereit';const progress=$('assetBar');if(progress)progress.style.width=(pending.type==='geo'?(AS.geo?100:25):100*n/26)+'%';const partial=$('partialStart');if(partial)partial.disabled=n<(pending.min||4);if((pending.type==='geo'&&AS.geo)||(pending.type==='flags'&&n===26)){const p=pending;pending=null;routeCleanup();p.run();}}
 if(AS.geo){if(AS.geo.neighbours)document.querySelectorAll('[data-surrounding]').forEach(el=>{if(!el.querySelector('path'))el.innerHTML=surroundingMarkup();});document.querySelectorAll('[data-outline]').forEach(el=>{if(!el.querySelector('svg')&&BY[el.dataset.outline])el.innerHTML=outlineMarkup(BY[el.dataset.outline]);});if(view==='stats'&&document.querySelector('[data-await-geo]')){renderStats();return;}}

}

function makeQuestion(cat,last){
 if(cat==='mixed'){const choices=availableQuizCats('mixed').filter(k=>k!=='outline'||AS.geo).filter(k=>k!=='flag'||fpool('flag').some(d=>AS.flags[d.i]));cat=pick(choices);}
 const d=weightedPick(cat,last,cat==='flag'?new Set(Object.keys(AS.flags)):null);if(!d)return null;
 const other=shuffle(C.filter(x=>x.id!==d.id));const base={id:d.id,cat,c:d};
 if(cat==='lang')return {...base,multi:true,p:'Welche Amtssprache(n) hat '+d.n+'?',set:new Set(d.l),opts:shuffle([...Object.values(LN),'Englisch'])};
 if(cat==='neighbors'){
  const ans=[...d.nb.map(k=>BY[k].n),...d.nc.map(k=>CN[k])];
  const dis=shuffle([...other.filter(x=>!d.nb.includes(x.i)).map(x=>x.n),...Object.keys(CN).filter(k=>!d.nc.includes(k)).map(k=>CN[k])]).slice(0,Math.max(3,7-ans.length));
  return{...base,multi:true,p:'Welche Nachbarn hat '+d.n+'?',set:new Set(ans),opts:shuffle([...ans,...dis])};
 }
 const T={flag:['Zu welchem Kanton geh\u00f6rt diese Flagge?',d=>d.n,'flag'],outline:['Welcher Kanton hat diesen Umriss?',d=>d.n,'outline'],capital:['Was ist die Hauptstadt von '+d.n+'?',d=>d.c],mountain:['Was ist der h\u00f6chste Berg im Kanton '+d.n+'?',d=>d.m],river:['Welches ist der gr\u00f6sste Fluss im Kanton '+d.n+'?',d=>d.r],area:['Wie gross ist die Fl\u00e4che von '+d.n+'?',fa],population:['Wie viele Einwohner hat '+d.n+'?',fp]};
 const [p,fn,vis]=T[cat],ans=fn(d),opts=[...new Set(other.map(fn))].filter(x=>x!==ans).slice(0,3);
 return {...base,p,vis,ans,opts:shuffle([ans,...opts])};
}

function renderQuiz(){

 const q=round.q,multi=!!q.multi,catName=CATS.find(c=>c[0]===q.cat)[1];

function gradeQuiz(){

let mapController=null;
function bindMap(id,onPick){
 const svg=$(id);if(!svg)return;const base=[0,0,360,225];let v=[...base],last=null,moved=0,pinch=null,points=new Map();
 function apply(){v[2]=Math.max(38,Math.min(360,v[2]));v[3]=v[2]/1.6;v[0]=Math.max(0,Math.min(360-v[2],v[0]));v[1]=Math.max(0,Math.min(225-v[3],v[1]));svg.setAttribute('viewBox',v.join(' '));}
 function local(x,y){const m=svg.getScreenCTM();if(!m)return{x:0,y:0};return new DOMPoint(x,y).matrixTransform(m.inverse());}
 function zoom(f,cx,cy){const r=svg.getBoundingClientRect();cx=cx??(r.left+r.width/2);cy=cy??(r.top+r.height/2);const p=local(cx,cy),fx=(p.x-v[0])/v[2],fy=(p.y-v[1])/v[3],w=Math.max(38,Math.min(360,v[2]*f)),h=w/1.6;v=[p.x-fx*w,p.y-fy*h,w,h];apply();}
 mapController={zoomIn:()=>zoom(.68),zoomOut:()=>zoom(1.45),reset:()=>{v=[...base];apply();},getView:()=>[...v]};
 const down=e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();points.set(e.pointerId,{x:e.clientX,y:e.clientY});const target=e.target.closest?.('[data-id]');if(points.size===1){last={x:e.clientX,y:e.clientY,id:target?+target.dataset.id:null};moved=0;}else{moved=100;const p=[...points.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}try{svg.setPointerCapture(e.pointerId);}catch(err){}};
 const move=e=>{if(!points.has(e.pointerId))return;e.preventDefault();points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size>=2){const p=[...points.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch&&d>1)zoom(pinch/d,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);pinch=d;return;}if(!last)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>7){const a=local(last.x,last.y),b=local(e.clientX,e.clientY);v[0]+=a.x-b.x;v[1]+=a.y-b.y;apply();}last.x=e.clientX;last.y=e.clientY;};
 const up=e=>{if(!points.has(e.pointerId))return;const tap=points.size===1&&last&&moved<8&&e.type==='pointerup',target=last?.id;points.delete(e.pointerId);pinch=null;if(!points.size){last=null;if(tap&&target!==null)onPick(target);}else moved=100;};

 const key=e=>{const t=e.target.closest('[data-id]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onPick(+t.dataset.id);}};
 svg.addEventListener('pointerdown',down,{passive:false});svg.addEventListener('pointermove',move,{passive:false});svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('wheel',wheel,{passive:false});svg.addEventListener('keydown',key);
 cleanupFns.push(()=>{points.clear();svg.removeEventListener('pointerdown',down);svg.removeEventListener('pointermove',move);svg.removeEventListener('pointerup',up);svg.removeEventListener('pointercancel',up);svg.removeEventListener('wheel',wheel);svg.removeEventListener('keydown',key);mapController=null;});
}

function flipCard(i){
 if(view!=='mem'||!mem||mem.done||mem.lock||mem.matched.has(i)||mem.open.includes(i)||!mem.cards[i])return;
 const b=$('memoryBoard').children[i];b.classList.add('open');b.setAttribute('aria-label',mem.cards[i].f?'Aufgedeckte Flagge':C[mem.cards[i].id].n);mem.open.push(i);

  mem.pairs++;mem.matched.add(a);mem.matched.add(z);mark(mem.cards[a].id,true,'memory');

}

// ------------- Profiles, backup, offline assets and source transparency. -------------
function renderPlayers(){paint('players',routebar('Spieler wechseln','<span class="tag">Getrennte Spielst\u00e4nde</span>')+'<div class="profiles">'+PL.players.map((p,i)=>'<div class="panel profile-card '+(i===PL.a?'selected':'')+'"><div class="profile-big">'+(i+1)+'</div><label class="eyebrow" for="pname'+i+'">Spieler '+(i+1)+'</label><input id="pname'+i+'" data-player-name="'+i+'" value="'+esc(p.name)+'" maxlength="40" aria-label="Name von Spieler '+(i+1)+'"><span class="profile-info">'+profileXP(p.data)+' EP \u00b7 '+esc(lv(profileXP(p.data)).name)+'</span>'+button(i===PL.a?'Aktiv':'Mit diesem Spieler spielen','switch-player',i===PL.a?'soft':'primary','data-index="'+i+'" '+(i===PL.a?'disabled':''))+'</div>').join('')+'</div>');}
function renderSettings(){paint('settings',routebar('Einstellungen')+'<div class="settings-grid"><div class="panel setting-card"><h2>Ansicht & Bedienung</h2><label class="switch"><input id="autoNext" type="checkbox" '+(prefs.autoNext?'checked':'')+'>Nach dem Feedback automatisch weiter</label><div class="segment">'+[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([v,n])=>'<button class="'+(prefs.theme===v?'on':'')+'" data-action="theme" data-value="'+v+'">'+n+'</button>').join('')+'</div><div class="actions">'+button(icon('fullscreen')+'Vollbild','fullscreen','small')+'</div></div><div class="panel setting-card"><h2>Spielstand sichern</h2><p>Export und Import bleiben mit der Originalversion kompatibel. Alle Spieler werden gemeinsam gespeichert.</p><div class="actions">'+button(icon('download')+'Export','export','small')+'<label class="btn small file-label">'+icon('upload')+'Import<input id="importFile" type="file" accept="application/json,.json"></label></div></div><div class="panel setting-card"><h2>Flaggen & Karten</h2><p>Einmal online laden, danach aus dem Ger\u00e4tespeicher nutzen. Eine vollst\u00e4ndige Offlinekopie gibt es, sobald alle Grafiken lokal vorliegen.</p><span class="asset-status" style="max-width:100%;text-align:left" data-asset-status></span><div class="actions">'+button('Neu laden','retry-assets','small')+button('Offlinekopie speichern','offline-export','small','id="offlineExport" '+(!(AS.geo&&Object.keys(AS.dataFlags).length===26)?'disabled':''))+'</div></div><div class="panel setting-card"><h2>Originaldaten & Hilfe</h2><p>Die 26 Kantonsdatens\u00e4tze deines Kollegen sind unver\u00e4ndert. Fl\u00e4chen, Einwohnerzahlen und Antworten wurden nicht neu recherchiert.</p><div class="actions">'+button('Quellen & Hinweise','sources','small')+button('Spielstand zur\u00fccksetzen','reset-confirm','small danger')+'</div></div></div>');}
function assetsDialog(){const a=assetLabel();openDialog('Grafiken auf diesem Ger\u00e4t','<p>'+esc(a.text)+'. Die Originaldatei verwendete Live-Abfragen. Diese Version speichert erfolgreich geladene Grafiken, startet aber auch bei einem Ladefehler und zeigt keine falschen Ersatzflaggen.</p><div class="filter-grid"><div class="filter-option"><strong>'+Object.keys(AS.dataFlags).length+' / 26</strong><small>Flaggen lokal gespeichert</small></div><div class="filter-option"><strong>'+(AS.geo?'Bereit':'Noch nicht geladen')+'</strong><small>Karte und Umrisse</small></div></div><p>Zum ersten Laden ben\u00f6tigst du eine Internetverbindung zu Wikimedia Commons und der Kartendatenquelle.</p>'+button('Laden erneut versuchen','retry-assets','primary'));}
function sourcesDialog(){openDialog('Quellen & Hinweise','<div class="sources-body"><h3>Inhalte aus deiner HTML-Datei</h3><p>26 Kantone, Namen, Hauptst\u00e4dte, Sprachen, Fl\u00e4chen, Einwohnerzahlen, Berge, Fl\u00fcsse und Nachbarschaften: unver\u00e4ndert aus <b>SwizQuiz (1).html</b>. Die Werte sind nicht als aktuelle amtliche Statistik verifiziert.</p><h3>Grafiken aus den Quellen der Vorlage</h3><p>Flaggen: Wikimedia Commons. Karte und Umrisse: swiss-maps, Datensatz 2021; Bundesamt f\u00fcr Statistik (BFS), GEOSTAT. Der Originaldatensatz nennt eine nichtkommerzielle Nutzung mit Quellenangabe.</p><div class="legal">Die Proportionen geladener Flaggen bleiben unver\u00e4ndert. Fehlen echte Grafiken, bleibt die betreffende Aufgabe im Ladebildschirm. Es werden keine Ersatzflaggen mit geratenen Symbolen eingesetzt.</div><h3>Tablet Edition '+VERSION+'</h3><p>Vollbild ist eine Browserfunktion und wird durch Antippen eingeschaltet. Lernfortschritt bleibt lokal. Ein Import ersetzt die vorhandenen Spieler; vorher exportieren.</p></div>');}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportProgress(){save();downloadBlob('swizquiz-spielstand.json',new Blob([JSON.stringify(PL,null,2)],{type:'application/json'}));toast('Spielstand exportiert.');}
let incoming=null;
async function importProgress(file){
 if(!file)return;if(file.size>2500000){toast('Diese Datei ist zu gross.');return;}
 try{incoming=validatePlayerFile(JSON.parse(await file.text()));openDialog('Spielstand importieren?','<p>Die Datei enth\u00e4lt '+incoming.players.length+' Spieler. Sie ersetzt die bisherigen Spieler auf diesem Browser. Ein Export vor dem Import ist empfehlenswert.</p>'+button('Spielstand ersetzen','import-confirm','primary')+button('Abbrechen','close-dialog'));}
 catch(e){incoming=null;toast('Import nicht m\u00f6glich: '+e.message);}
}
function resetDialog(){openDialog('Diesen Spielstand l\u00f6schen?','<p>Nur der Fortschritt von <b>'+esc(PL.players[PL.a].name)+'</b> wird zur\u00fcckgesetzt. Die anderen Spieler und die geladenen Grafiken bleiben erhalten.</p>'+button('Jetzt zur\u00fccksetzen','reset-player','danger')+button('Abbrechen','close-dialog','primary'));}
async function exportOffline(){
 if(!AS.geo||Object.keys(AS.dataFlags).length!==26){toast('Bitte zuerst alle Flaggen und die Karte laden.');return;}
 const doc=new DOMParser().parseFromString(SHELL,'text/html');
 const embeddedEl=doc.getElementById('sq-embedded');embeddedEl.textContent=JSON.stringify({flags:AS.dataFlags,geo:AS.geo}).replace(/</g,'\\u003c');
 doc.querySelector('link[rel=manifest]')?.remove();
 // The file includes content assets but never another person's stored profile data.
 downloadBlob('SwizQuiz_Offline_Tablet.html',new Blob(['<!doctype html>\n'+doc.documentElement.outerHTML],{type:'text/html;charset=utf-8'}));toast('Offlinekopie gespeichert. Spielst\u00e4nde bitte separat exportieren.');
}

// ------------- Delegated controls and boot. -------------
const ACTIONS={
 home:()=>go('home'),qcat:()=>go('qcat'),learn:()=>go('learn'),smap:()=>go('smap'),stats:()=>go('stats'),players:()=>go('players'),settings:()=>go('settings'),
 fullscreen:toggleFullscreen,filter:filterDialog,difficult:()=>difficultDialog(0),sources:sourcesDialog,assets:assetsDialog,'points-help':pointsHelp,
 'close-dialog':closeDialog,
 'set-filter':el=>{S.filterMode=el.dataset.value;learnOrder=null;save();closeDialog();go('home');},
 'category':el=>startQuiz(el.dataset.cat,'Quiz \u00b7 '+QC.find(c=>c[0]===el.dataset.cat)[1],10),
 flash:()=>startQuiz('flag','Flaggen-Blitz',30,60),duel:()=>startQuiz('capital','Hauptstadt-Duell',10),
 'outline-game':()=>startQuiz('outline','Umriss erkennen',8),'map-game':startMap,memory:startMemory,
 answer:el=>selectAnswer(+el.dataset.index),'confirm-answer':gradeQuiz,'next-question':nextQuestion,'next-map':nextMap,
 'zoom-in':()=>mapController?.zoomIn(),'zoom-out':()=>mapController?.zoomOut(),'zoom-reset':()=>mapController?.reset(),
 'learn-prev':()=>{learnIndex--;renderLearn();},'learn-next':()=>{learnIndex++;renderLearn();},'learn-canton':el=>{closeDialog();go('learn',+el.dataset.id);},
 'difficult-page':el=>difficultDialog(+el.dataset.page),'remove-difficult':el=>{delete S.wrong[+el.dataset.id];save();difficultDialog(dialogPage);},
 'flip-card':el=>flipCard(+el.dataset.index),
 'switch-player':el=>{const i=+el.dataset.index;if(!PL.players[i])return;save();PL.a=i;S=PL.players[i].data;learnOrder=null;save();go('home');},
 theme:el=>{prefs.theme=el.dataset.value;savePrefs();renderSettings();},
 export:exportProgress,'offline-export':exportOffline,
 'import-confirm':()=>{if(!incoming)return;PL=incoming;incoming=null;S=PL.players[PL.a].data;loadWarning='';learnOrder=null;PL.players.forEach(p=>p.data.xp=profileXP(p.data));save();closeDialog();go('home');toast('Spielstand importiert.');},
 'reset-confirm':resetDialog,'reset-player':()=>{S=dp();loadWarning='';learnOrder=null;save();closeDialog();go('home');toast('Spielstand zur\u00fcckgesetzt.');},
 'retry-assets':()=>{loadAssets(true);toast('Grafiken werden erneut geladen.');},
 'start-partial':()=>{if(!pending)return;const p=pending;if(Object.keys(AS.flags).length<(p.min||4))return;pending=null;routeCleanup();p.run();},
 again:()=>{if(!summary)return;if(summary.type==='memory')startMemory();else if(summary.type==='map')startMap();else startQuiz(summary.again.cat,summary.again.title,summary.again.total,summary.again.time);}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];if(fn){e.preventDefault();fn(el);}});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='autoNext'){prefs.autoNext=el.checked;savePrefs();}
 if(el.id==='learnSelect'){learnIndex=+el.value;renderLearn();}
 if(el.id==='statsCategory'){statsCat=el.value;renderStats();}
 if(el.id==='importFile')importProgress(el.files[0]);
 if(el.matches('[data-player-name]')){const i=+el.dataset.playerName;PL.players[i].name=el.value.trim().slice(0,40)||'Spieler '+(i+1);save();el.value=PL.players[i].name;}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickQuizClock();scheduleLayout();}});
window.addEventListener('online',()=>loadAssets());
$('rotateScreen').innerHTML=icon('rotate')+'<h2>Bitte quer drehen</h2><p>So haben die grosse Flagge und alle Antworten gemeinsam Platz.</p>'+button(icon('fullscreen')+'Vollbild','fullscreen');
renderHome();scheduleLayout();
if(loadWarning)openDialog('Gespeicherten Stand pr\u00fcfen','<p>'+esc(loadWarning)+'</p>'+button('Verstanden','close-dialog','primary'));
if(!storageOK)toast('Der Browser blockiert lokale Speicherung. Bitte Spielst\u00e4nde regelm\u00e4ssig exportieren.');
if(!window.__SQ_TEST__)loadAssets();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.__SQ_TEST__){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{});}
// Read-only source data plus a small QA hook, enabled only in an explicit test harness.
if(window.__SQ_TEST__){window.__SQ={VERSION,C,R,CATS,QC,MAXEP,AS,get state(){return{view,PL,S,prefs,round,mem,mapState,summary,pending,routeToken};},go,startQuiz,startMap,startMemory,makeQuestion,gradeQuiz,nextQuestion,gradeMap,nextMap,flipCard,mark,profileXP,validatePlayerFile,exportProgress,loadAssets,makeGeo,assetsChanged,applyTheme,renderLearn,renderStats,dbPut,dbGet,setPrefs(p){Object.assign(prefs,p);savePrefs();},setPlayerFile(raw){PL=validatePlayerFile(raw);S=PL.players[PL.a].data;PL.players.forEach(p=>p.data.xp=profileXP(p.data));save();},setAssetFixtures(g,flags){AS.geo=g;AS.geoState='ready';AS.flags=flags;AS.dataFlags=flags;AS.flagState='ready';assetsChanged();},get map(){return mapController;}};}
})();
